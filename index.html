<!doctype html>
<html lang="hi">

<head>
  <meta charset="UTF-8" />
  <!-- 1. Critical Instant Loader Preloads (Browser starts fetching these immediately) -->
  <link rel="preload" as="image" href="/loader/laoder.png" fetchpriority="high" />
  <link rel="preload" as="image" href="/sprites/mainlogo.png" fetchpriority="high" />
  <link rel="preload" as="image" href="/loader/loaderline.png" fetchpriority="high" />
  <link rel="preload" as="image" href="/HORSES/horse5_1mb.gif" fetchpriority="high" />

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Horse Race" />
  <meta name="theme-color" content="#070b14" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <title>Horse Race Arena</title>

  <!-- Instant 0ms Inline Styling for Circle Loader (Paints on Frame 1 before any JS or CSS files download) -->
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #070b14;
      overflow: hidden;
    }

    #initial-circle-loader {
      position: fixed;
      inset: 0;
      z-index: 99999999;
      background-color: #070b14;
      background-image: radial-gradient(ellipse at 50% 50%, #1e1308 0%, #070b14 85%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    .initial-spinner-ring {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3.5px solid rgba(212, 151, 85, 0.18);
      border-top: 3.5px solid #ffd88a;
      border-right: 3.5px solid #d49755;
      box-shadow: 0 0 24px rgba(255, 216, 138, 0.35), inset 0 0 12px rgba(212, 151, 85, 0.2);
      animation: initial-spin 0.75s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .initial-spinner-text {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.2px;
      color: #e6be8a;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 12px rgba(230, 190, 138, 0.4);
    }

    @keyframes initial-spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- SVG Chroma Green Despill / Defringe Filter for Horse GIFs -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none; overflow: hidden;" aria-hidden="true">
    <defs>
      <filter id="horse-green-despill" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="
            1.00  0.00  0.00  0  0
            0.18  0.64  0.18  0  0
            0.00  0.00  1.00  0  0
            0.00  0.00  0.00  1  0
          "
        />
      </filter>
    </defs>
  </svg>

  <div id="root">
    <!-- Instant Circle Loader: Shows immediately at 0ms until React and Main Loader mount -->
    <div id="initial-circle-loader">
      <div class="initial-spinner-ring"></div>
      <div class="initial-spinner-text">LOADING...</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
